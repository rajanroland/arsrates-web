name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time. The prod server pushes new rates every 15 minutes; a
# newer push cancels any deploy still running or waiting, so one stuck run
# (2026-10-06: stuck 2h waiting on the github-pages environment) can't block
# every later deploy. Only the newest rates matter.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Plain-text rates for AI tools (arsrates.com/rates.md), written from the
      # rates file being published. The generator comes from the main repo's
      # scripts/pages/ (copied by the prod build); skip until it's there.
      - name: Write rates.md
        run: |
          if [ -f tools/make_rates_md.py ]; then
            python3 tools/make_rates_md.py public/static/data/current_rates.json public/rates.md
          else
            echo "tools/make_rates_md.py not found yet; skipping rates.md"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
