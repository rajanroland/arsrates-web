name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time. The prod server pushes new rates every 15 minutes; a
# newer push replaces any deploy still waiting to start, so slow GitHub days
# don't pile up runs that end in timeouts.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
