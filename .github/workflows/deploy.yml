name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time. The prod server pushes new rates every 15 minutes; a
# newer push cancels any deploy still running or waiting, so one stuck run
# (2026-10-06: stuck 2h waiting on the github-pages environment) can't block
# every later deploy. Only the newest rates matter.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Plain-text rates for AI tools (arsrates.com/rates.md), written from the
      # rates file being published. The generator comes from the main repo's
      # scripts/pages/ (copied by the prod build); skip until it's there.
      - name: Write rates.md
        run: |
          if [ -f tools/make_rates_md.py ]; then
            python3 tools/make_rates_md.py public/static/data/current_rates.json public/rates.md
          else
            echo "tools/make_rates_md.py not found yet; skipping rates.md"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      # A Pages deployment can stay "in progress" on GitHub's side after the
      # workflow run is gone (2026-10-07: a 500 from the Pages API at 18:45 UTC
      # blocked the next two deploys with "in progress deployment, please
      # cancel <sha> first"). cancel-in-progress above only cancels workflow
      # runs, so cancel any unfinished Pages deployment from the last few
      # commits here. Pages deployment ids accept the commit SHA. Never fails
      # the job: if this can't help, the deploy step reports the real error.
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=10" --jq '.[].sha' || true); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            case "$status" in
              ""|succeed|deployment_cancelled|deployment_failed|deployment_content_failed|deployment_attempt_error|deployment_lost) ;;
              *)
                echo "Cancelling Pages deployment $sha (status: $status)"
                gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" || true
                ;;
            esac
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
